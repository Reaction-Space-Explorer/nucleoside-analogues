[project]
name = "nucleoside-analogues"
version = "0.2.0"
description = "Matching combinatorially enumerated nucleoside-analogue libraries against in-silico prebiotic chemical reaction networks, and tracing thermodynamically spontaneous synthetic pathways."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
  { name = "Matthew Ludwig" },
  { name = "Siddhant Sharma" },
  { name = "Romulo Cruz-Simbron" },
  { name = "Aayush Arya" },
  { name = "Devansh Jain" },
  { name = "Róża Okoń" },
  { name = "Markus Meringer" },
  { name = "H. James Cleaves II" },
]
dependencies = [
  "rdkit>=2024.3",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
thermo = ["equilibrator-api>=0.6", "equilibrator-assets>=0.6"]
figures = ["matplotlib>=3.8", "seaborn>=0.13"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "shap>=0.45"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyright>=1.1.380", "dimorphite-dl>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nucleoside_analogues"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "B", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: deselect with -m 'not slow'"]
